<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J-wordle_TS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ポップアップアニメーション */
    #popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-weight: bold;
      z-index: 50;
    }

    /* 震えアニメーション */
    .shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center p-4">

  <h1 class="text-3xl font-bold mb-2">J-wordle_TS</h1>
  <div id="category-hint" class="text-gray-300 text-lg mb-2"></div>
  <div id="dict-count" class="bg-gray-700 px-3 py-1 rounded mb-4"></div>

  <!-- ポップアップ -->
  <div id="popup"></div>

  <!-- 盤面 -->
  <div id="board" class="grid grid-rows-6 gap-2 mb-4"></div>

  <!-- キーボード -->
  <div id="keyboard" class="grid grid-cols-10 gap-2"></div>

  <div id="result" class="text-xl font-bold mt-4"></div>

  <script>
    const keys = [
      "あ","い","う","え","お",
      "か","き","く","け","こ",
      "さ","し","す","せ","そ",
      "た","ち","つ","て","と",
      "な","に","ぬ","ね","の",
      "は","ひ","ふ","へ","ほ",
      "ま","み","む","め","も",
      "や","ゆ","よ",
      "ら","り","る","れ","ろ",
      "わ","を","ん",
      "削","決定"
    ];

    const boardEl = document.getElementById("board");
    const keyboardEl = document.getElementById("keyboard");
    const resultEl = document.getElementById("result");
    const dictCountEl = document.getElementById("dict-count");
    const categoryHintEl = document.getElementById("category-hint");
    const popupEl = document.getElementById("popup");

    let dictionary = [];
    let answer = "";
    let answerCategory = "";
    let currentRow = 0;
    let currentCol = 0;
    const maxRows = 6;
    const maxCols = 5;

    // 盤面生成
    for (let r = 0; r < maxRows; r++) {
      const row = document.createElement("div");
      row.className = "grid grid-cols-5 gap-2";
      for (let c = 0; c < maxCols; c++) {
        const cell = document.createElement("div");
        cell.className = "w-12 h-12 border border-gray-600 flex items-center justify-center text-2xl font-bold";
        row.appendChild(cell);
      }
      boardEl.appendChild(row);
    }

    // キーボード生成
    keys.forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      b.className = "bg-gray-700 hover:bg-gray-600 px-2 py-2 rounded";
      b.onclick = () => handleKey(k);
      keyboardEl.appendChild(b);
    });

    function handleKey(k) {
      const rows = boardEl.children;
      const cells = rows[currentRow].children;

      if (k === "削") {
        if (currentCol > 0) {
          currentCol--;
          cells[currentCol].textContent = "";
        }
        return;
      }

      if (k === "決定") {
        if (currentCol < maxCols) return;
        const guess = Array.from(cells).map(c => c.textContent).join("");
        checkGuess(guess);
        return;
      }

      if (currentCol < maxCols && /^[ぁ-んー]$/.test(k)) {
        cells[currentCol].textContent = k;
        currentCol++;
      }
    }

    async function initGame() {
      dictionary = await fetch("dictionary.json").then(r => r.json());
      dictCountEl.textContent = `語数: ${dictionary.length}`;
      const answerObj = dictionary[Math.floor(Math.random() * dictionary.length)];
      answer = answerObj.word;
      answerCategory = answerObj.category;
      categoryHintEl.textContent = `カテゴリ: ${answerCategory}`;
    }

    function showPopup(message) {
      popupEl.textContent = message;
      popupEl.style.opacity = "1";
      setTimeout(() => {
        popupEl.style.opacity = "0";
      }, 2000);
    }

    function shakeRow(rowIndex) {
      const row = boardEl.children[rowIndex];
      row.classList.add("shake");
      setTimeout(() => row.classList.remove("shake"), 300);
    }

    function checkGuess(guess) {
      const rows = boardEl.children;
      const cells = rows[currentRow].children;

      if (guess.length !== 5) {
        showPopup("5文字入力してください");
        shakeRow(currentRow);
        return;
      }

      const isValid = dictionary.some(item => item.word === guess);
      if (!isValid) {
        showPopup("辞書に存在しない単語です");
        shakeRow(currentRow);
        return;
      }

      for (let i = 0; i < 5; i++) {
        if (guess[i] === answer[i]) {
          cells[i].classList.add("bg-green-600");
        } else if (answer.includes(guess[i])) {
          cells[i].classList.add("bg-yellow-500");
        } else {
          cells[i].classList.add("bg-gray-700");
        }
      }

      if (guess === answer) {
        showPopup("🎉 正解！");
      } else {
        currentRow++;
        currentCol = 0;
        if (currentRow >= maxRows) {
          showPopup(`残念！正解は「${answer}」`);
        }
      }
    }

    initGame();
  </script>

</body>
</html>
