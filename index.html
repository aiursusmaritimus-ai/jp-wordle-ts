<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J-wordle_TS</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #f3f3f3;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #e2e3e5;
      color: #000;
      padding: 12px 24px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-weight: bold;
      font-size: 18px;
      z-index: 50;
      border: 1px solid #d3d6da;
    }

    .shake {
      animation: shake 0.3s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .correct {
      background-color: #6aaa64 !important;
      border-color: #6aaa64 !important;
      color: white;
    }
    .present {
      background-color: #c9b458 !important;
      border-color: #c9b458 !important;
      color: white;
    }
    .absent {
      background-color: #787c7e !important;
      border-color: #787c7e !important;
      color: white;
    }

    .key-default {
      background-color: #d3d6da;
      color: #000;
      border-radius: 4px;
    }
    .key-default:hover {
      background-color: #e5e7eb;
    }

    .key-enter {
      background-color: #6aaa64;
      color: white;
      border-radius: 4px;
    }
    .key-enter:hover {
      background-color: #7cbc75;
    }

    .key-delete {
      background-color: #787c7e;
      color: white;
      border-radius: 4px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .key-delete:hover {
      background-color: #8c9092;
    }

    .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>

<body class="flex flex-col items-center p-4">

  <h1 class="text-4xl font-bold mb-4">J-wordle_TS</h1>
  <div id="category-hint" class="text-gray-700 text-lg mb-2"></div>
  <div id="dict-count" class="bg-gray-300 px-3 py-1 rounded mb-4"></div>

  <div id="popup"></div>

  <div id="board" class="grid grid-rows-6 gap-2 mb-4"></div>

  <div id="keyboard" class="grid grid-cols-10 gap-2 mt-4"></div>

  <div id="result" class="text-xl font-bold mt-4"></div>

  <script>
    const boardEl = document.getElementById("board");
    const keyboardEl = document.getElementById("keyboard");
    const resultEl = document.getElementById("result");
    const dictCountEl = document.getElementById("dict-count");
    const categoryHintEl = document.getElementById("category-hint");
    const popupEl = document.getElementById("popup");

    let dictionary = [];
    let answer = "";
    let answerCategory = "";
    let currentRow = 0;
    let currentCol = 0;
    const maxRows = 6;
    const maxCols = 5;

    /* 盤面生成 */
    for (let r = 0; r < maxRows; r++) {
      const row = document.createElement("div");
      row.className = "grid grid-cols-5 gap-2";
      for (let c = 0; c < maxCols; c++) {
        const cell = document.createElement("div");
        cell.className =
          "w-14 h-14 border border-gray-400 flex items-center justify-center text-3xl font-bold bg-white";
        row.appendChild(cell);
      }
      boardEl.appendChild(row);
    }

    /* キーボード（ひらがな表） */
    const keyRows = [
      ["わ","ら","や","ま","は","な","た","さ","か","あ"],
      ["","り","","み","ひ","に","ち","し","き","い"],
      ["を","る","ゆ","む","ふ","ぬ","つ","す","く","う"],
      ["","れ","","め","へ","ね","て","せ","け","え"],
      ["ん","ろ","よ","も","ほ","の","と","そ","こ","お"]
    ];

    keyRows.forEach(row => {
      row.forEach(k => {
        const b = document.createElement("button");
        b.textContent = k || "";
        b.className = k ? "key-default w-10 h-10" : "w-10 h-10";
        if (k) b.onclick = () => handleKey(k);
        keyboardEl.appendChild(b);
      });
    });

    /* 濁音・半濁音・小文字キー */
    const extraKeys = [
      "゛","゜","小"
    ];

    extraKeys.forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      b.className = "key-default w-10 h-10";
      b.onclick = () => handleKey(k);
      keyboardEl.appendChild(b);
    });

    /* 削除・決定ボタン */
    const controlRow = document.createElement("div");
    controlRow.className = "col-span-10 flex justify-center space-x-4 mt-2";

    const delBtn = document.createElement("button");
    delBtn.className = "key-delete px-4 py-2";
    delBtn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5l7-7m0 14l-7-7" />
      </svg>
      削除
    `;
    delBtn.onclick = () => handleKey("削");

    const enterBtn = document.createElement("button");
    enterBtn.textContent = "決定";
    enterBtn.className = "key-enter px-4 py-2";
    enterBtn.onclick = () => handleKey("決定");

    controlRow.appendChild(delBtn);
    controlRow.appendChild(enterBtn);
    keyboardEl.appendChild(controlRow);

    /* 濁音・半濁音・小文字変換テーブル */
    const dakuten = {
      "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
      "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
      "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
      "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"
    };

    const handakuten = {
      "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"
    };

    const smallMap = {
      "あ":"ぁ","い":"ぃ","う":"ぅ","え":"ぇ","お":"ぉ",
      "や":"ゃ","ゆ":"ゅ","よ":"ょ",
      "つ":"っ",
      "わ":"ゎ"
    };

    /* 入力処理 */
    function handleKey(k) {
      const rows = boardEl.children;
      const cells = rows[currentRow].children;

      if (k === "削") {
        if (currentCol > 0) {
          currentCol--;
          cells[currentCol].textContent = "";
        }
        return;
      }

      if (k === "決定") {
        if (currentCol < maxCols) return;
        const guess = Array.from(cells).map(c => c.textContent).join("");
        checkGuess(guess);
        return;
      }

      /* 濁音 */
      if (k === "゛") {
        const last = cells[currentCol - 1]?.textContent;
        if (dakuten[last]) {
          cells[currentCol - 1].textContent = dakuten[last];
        }
        return;
      }

      /* 半濁音 */
      if (k === "゜") {
        const last = cells[currentCol - 1]?.textContent;
        if (handakuten[last]) {
          cells[currentCol - 1].textContent = handakuten[last];
        }
        return;
      }

      /* 小文字化 */
      if (k === "小") {
        const last = cells[currentCol - 1]?.textContent;
        if (smallMap[last]) {
          cells[currentCol - 1].textContent = smallMap[last];
        }
        return;
      }

      /* 通常入力 */
      if (currentCol < maxCols && /^[ぁ-んー]$/.test(k)) {
        cells[currentCol].textContent = k;
        currentCol++;
      }
    }

    /* ゲーム開始 */
    async function initGame() {
      dictionary = await fetch("dictionary.json").then(r => r.json());
      dictCountEl.textContent = `語数: ${dictionary.length}`;
      const answerObj = dictionary[Math.floor(Math.random() * dictionary.length)];
      answer = answerObj.word;
      answerCategory = answerObj.category;
      categoryHintEl.textContent = `カテゴリ: ${answerCategory}`;
    }

    /* ポップアップ */
    function showPopup(message) {
      popupEl.textContent = message;
      popupEl.style.opacity = "1";
      setTimeout(() => {
        popupEl.style.opacity = "0";
      }, 2000);
    }

    /* 震え */
    function shakeRow(rowIndex) {
      const row = boardEl.children[rowIndex];
      row.classList.add("shake");
      setTimeout(() => row.classList.remove("shake"), 300);
    }

    /* 判定 */
    function checkGuess(guess) {
      const rows = boardEl.children;
      const cells = rows[currentRow].children;

      if (guess.length !== 5) {
        showPopup("5文字入力してください");
        shakeRow(currentRow);
        return;
      }

      const isValid = dictionary.some(item => item.word === guess);
      if (!isValid) {
        showPopup("辞書に存在しない単語です");
        shakeRow(currentRow);
        return;
      }

      for (let i = 0; i < 5; i++) {
        if (guess[i] === answer[i]) {
          cells[i].classList.add("correct");
        } else if (answer.includes(guess[i])) {
          cells[i].classList.add("present");
        } else {
          cells[i].classList.add("absent");
        }
      }

      if (guess === answer) {
        showPopup("🎉 正解！");
      } else {
        currentRow++;
        currentCol = 0;
        if (currentRow >= maxRows) {
          showPopup(`残念！正解は「${answer}」`);
        }
      }
    }

    initGame();
  </script>
</body>
</html>
