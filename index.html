<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>J-wordle_TS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #121213;
    }
    .tile {
      width: 3rem;
      height: 3rem;
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      text-transform: none;
      margin: 0.15rem;
      box-sizing: border-box;
    }
    .tile-empty {
      background-color: #121213;
      border-color: #3a3a3c;
      color: #d7dadc;
    }
    .tile-correct {
      background-color: #538d4e;
      border-color: #538d4e;
      color: #ffffff;
    }
    .tile-present {
      background-color: #b59f3b;
      border-color: #b59f3b;
      color: #ffffff;
    }
    .tile-absent {
      background-color: #3a3a3c;
      border-color: #3a3a3c;
      color: #ffffff;
    }
    .key-btn {
      min-width: 2.4rem;
      height: 2.6rem;
      margin: 0.12rem;
      border-radius: 0.25rem;
      font-size: 1.1rem;
      font-weight: 600;
      background-color: #818384;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .key-small {
      font-size: 0.9rem;
    }
    .key-correct {
      background-color: #538d4e !important;
    }
    .key-present {
      background-color: #b59f3b !important;
    }
    .key-absent {
      background-color: #3a3a3c !important;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .shake {
      animation: shake 0.4s;
    }
  </style>
</head>
<body class="text-gray-100">
  <div class="min-h-[100dvh] flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-gray-700">
      <div class="flex items-center space-x-2">
        <h1 class="text-xl font-bold tracking-wide">J-wordle_TS</h1>
        <span id="word-count-badge" class="text-xs px-2 py-1 rounded-full bg-gray-700">
          読み込み中…
        </span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="rules-btn" class="text-xs px-3 py-1 rounded border border-gray-500 hover:bg-gray-700">
          ルール説明
        </button>
        <button id="stats-btn" class="text-xs px-3 py-1 rounded border border-gray-500 hover:bg-gray-700">
          統計
        </button>
      </div>
    </header>

    <!-- Main game area -->
    <main class="flex-1 flex flex-col items-center justify-between px-2 pt-4 pb-2">
      <!-- Board -->
      <div id="board" class="flex flex-col items-center mb-4">
        <!-- 6 rows x 5 tiles -->
        <div class="flex flex-col">
          <!-- rows will be generated by JS, but we keep placeholders for layout -->
          <div class="flex" data-row="0">
            <div class="tile tile-empty" data-row="0" data-col="0"></div>
            <div class="tile tile-empty" data-row="0" data-col="1"></div>
            <div class="tile tile-empty" data-row="0" data-col="2"></div>
            <div class="tile tile-empty" data-row="0" data-col="3"></div>
            <div class="tile tile-empty" data-row="0" data-col="4"></div>
          </div>
          <div class="flex" data-row="1">
            <div class="tile tile-empty" data-row="1" data-col="0"></div>
            <div class="tile tile-empty" data-row="1" data-col="1"></div>
            <div class="tile tile-empty" data-row="1" data-col="2"></div>
            <div class="tile tile-empty" data-row="1" data-col="3"></div>
            <div class="tile tile-empty" data-row="1" data-col="4"></div>
          </div>
          <div class="flex" data-row="2">
            <div class="tile tile-empty" data-row="2" data-col="0"></div>
            <div class="tile tile-empty" data-row="2" data-col="1"></div>
            <div class="tile tile-empty" data-row="2" data-col="2"></div>
            <div class="tile tile-empty" data-row="2" data-col="3"></div>
            <div class="tile tile-empty" data-row="2" data-col="4"></div>
          </div>
          <div class="flex" data-row="3">
            <div class="tile tile-empty" data-row="3" data-col="0"></div>
            <div class="tile tile-empty" data-row="3" data-col="1"></div>
            <div class="tile tile-empty" data-row="3" data-col="2"></div>
            <div class="tile tile-empty" data-row="3" data-col="3"></div>
            <div class="tile tile-empty" data-row="3" data-col="4"></div>
          </div>
          <div class="flex" data-row="4">
            <div class="tile tile-empty" data-row="4" data-col="0"></div>
            <div class="tile tile-empty" data-row="4" data-col="1"></div>
            <div class="tile tile-empty" data-row="4" data-col="2"></div>
            <div class="tile tile-empty" data-row="4" data-col="3"></div>
            <div class="tile tile-empty" data-row="4" data-col="4"></div>
          </div>
          <div class="flex" data-row="5">
            <div class="tile tile-empty" data-row="5" data-col="0"></div>
            <div class="tile tile-empty" data-row="5" data-col="1"></div>
            <div class="tile tile-empty" data-row="5" data-col="2"></div>
            <div class="tile tile-empty" data-row="5" data-col="3"></div>
            <div class="tile tile-empty" data-row="5" data-col="4"></div>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-20 bg-gray-800 text-xs px-3 py-2 rounded shadow opacity-0 pointer-events-none transition-opacity">
        メッセージ
      </div>

      <!-- Keyboard -->
      <div class="w-full max-w-md mx-auto">
        <!-- Modifier row -->
        <div class="flex justify-center mb-1">
          <button class="key-btn key-small" data-modifier="dakuten">゛濁</button>
          <button class="key-btn key-small" data-modifier="handakuten">゜半</button>
          <button class="key-btn key-small" data-modifier="small">小文字</button>
          <button class="key-btn key-small" data-action="backspace">⌫ 消去</button>
          <button class="key-btn key-small" data-action="enter">決定</button>
        </div>

        <!-- Gojuon keyboard -->
        <div id="keyboard" class="flex flex-col items-center">
          <!-- あ段 -->
          <div class="flex justify-center">
            <button class="key-btn" data-char="あ">あ</button>
            <button class="key-btn" data-char="か">か</button>
            <button class="key-btn" data-char="さ">さ</button>
            <button class="key-btn" data-char="た">た</button>
            <button class="key-btn" data-char="な">な</button>
            <button class="key-btn" data-char="は">は</button>
            <button class="key-btn" data-char="ま">ま</button>
            <button class="key-btn" data-char="や">や</button>
            <button class="key-btn" data-char="ら">ら</button>
            <button class="key-btn" data-char="わ">わ</button>
          </div>
          <!-- い段 -->
          <div class="flex justify-center">
            <button class="key-btn" data-char="い">い</button>
            <button class="key-btn" data-char="き">き</button>
            <button class="key-btn" data-char="し">し</button>
            <button class="key-btn" data-char="ち">ち</button>
            <button class="key-btn" data-char="に">に</button>
            <button class="key-btn" data-char="ひ">ひ</button>
            <button class="key-btn" data-char="み">み</button>
            <button class="key-btn" data-char="">　</button>
            <button class="key-btn" data-char="り">り</button>
            <button class="key-btn" data-char="">　</button>
          </div>
          <!-- う段 -->
          <div class="flex justify-center">
            <button class="key-btn" data-char="う">う</button>
            <button class="key-btn" data-char="く">く</button>
            <button class="key-btn" data-char="す">す</button>
            <button class="key-btn" data-char="つ">つ</button>
            <button class="key-btn" data-char="ぬ">ぬ</button>
            <button class="key-btn" data-char="ふ">ふ</button>
            <button class="key-btn" data-char="む">む</button>
            <button class="key-btn" data-char="ゆ">ゆ</button>
            <button class="key-btn" data-char="る">る</button>
            <button class="key-btn" data-char="">　</button>
          </div>
          <!-- え段 -->
          <div class="flex justify-center">
            <button class="key-btn" data-char="え">え</button>
            <button class="key-btn" data-char="け">け</button>
            <button class="key-btn" data-char="せ">せ</button>
            <button class="key-btn" data-char="て">て</button>
            <button class="key-btn" data-char="ね">ね</button>
            <button class="key-btn" data-char="へ">へ</button>
            <button class="key-btn" data-char="め">め</button>
            <button class="key-btn" data-char="">　</button>
            <button class="key-btn" data-char="れ">れ</button>
            <button class="key-btn" data-char="">　</button>
          </div>
          <!-- お段 -->
          <div class="flex justify-center mb-1">
            <button class="key-btn" data-char="お">お</button>
            <button class="key-btn" data-char="こ">こ</button>
            <button class="key-btn" data-char="そ">そ</button>
            <button class="key-btn" data-char="と">と</button>
            <button class="key-btn" data-char="の">の</button>
            <button class="key-btn" data-char="ほ">ほ</button>
            <button class="key-btn" data-char="も">も</button>
            <button class="key-btn" data-char="よ">よ</button>
            <button class="key-btn" data-char="ろ">ろ</button>
            <button class="key-btn" data-char="を">を</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Rules modal -->
    <div id="rules-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden">
      <div class="bg-gray-900 rounded-lg p-4 max-w-sm w-11/12">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold">ルール説明</h2>
          <button class="text-xs px-2 py-1 rounded bg-gray-700" id="rules-close">閉じる</button>
        </div>
        <p class="text-xs leading-relaxed mb-2">
          5文字のひらがな単語を6回以内に当てるゲームです。各行に推測した単語を入力し、「決定」ボタンで判定します。
        </p>
        <ul class="text-xs list-disc list-inside space-y-1 mb-2">
          <li><span class="font-bold">🟩 緑:</span> 文字と位置が一致しています。</li>
          <li><span class="font-bold">🟨 黄:</span> 単語に含まれますが位置が違います。</li>
          <li><span class="font-bold">⬛ 灰:</span> 単語に含まれません。</li>
        </ul>
        <p class="text-xs">
          入力した単語が辞書に存在しない場合は、トースト通知とシェイクアニメーションで知らせます。
        </p>
      </div>
    </div>

    <!-- Stats modal -->
    <div id="stats-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden">
      <div class="bg-gray-900 rounded-lg p-4 max-w-sm w-11/12">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold">統計</h2>
          <button class="text-xs px-2 py-1 rounded bg-gray-700" id="stats-close">閉じる</button>
        </div>
        <div class="text-xs space-y-1">
          <p>プレイ回数: <span id="stat-played">0</span></p>
          <p>勝率: <span id="stat-win-rate">0</span>%</p>
          <p>連勝数: <span id="stat-streak">0</span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Game state
    let dictionary = [];
    let validWordsSet = new Set();
    let targetPool = [];
    let targetWord = "";
    let currentRow = 0;
    let currentCol = 0;
    let currentInput = [];
    let gameOver = false;

    // Stats
    const STATS_KEY = "jwordle_ts_stats";
    let stats = {
      played: 0,
      wins: 0,
      streak: 0,
      lastResultWin: false
    };

    function loadStats() {
      const raw = localStorage.getItem(STATS_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          stats = Object.assign(stats, parsed);
        } catch (e) {}
      }
      updateStatsUI();
    }

    function saveStats() {
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    }

    function updateStatsUI() {
      document.getElementById("stat-played").textContent = stats.played;
      const winRate = stats.played > 0 ? Math.round((stats.wins / stats.played) * 100) : 0;
      document.getElementById("stat-win-rate").textContent = winRate;
      document.getElementById("stat-streak").textContent = stats.streak;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 1500);
    }

    function shakeRow(rowIndex) {
      const rowEl = document.querySelector(`div[data-row="${rowIndex}"]`);
      if (!rowEl) return;
      rowEl.classList.add("shake");
      setTimeout(() => rowEl.classList.remove("shake"), 400);
    }

    function resetBoard() {
      const tiles = document.querySelectorAll(".tile");
      tiles.forEach(tile => {
        tile.textContent = "";
        tile.classList.remove("tile-correct", "tile-present", "tile-absent");
        tile.classList.add("tile-empty");
      });
      const keys = document.querySelectorAll("#keyboard .key-btn");
      keys.forEach(key => {
        key.classList.remove("key-correct", "key-present", "key-absent");
      });
      currentRow = 0;
      currentCol = 0;
      currentInput = [];
      gameOver = false;
    }

    function chooseTargetWord() {
      if (targetPool.length === 0) return;
      const idx = Math.floor(Math.random() * targetPool.length);
      targetWord = targetPool[idx].h;
      // console.log("Target:", targetWord);
    }

    function setTile(row, col, char) {
      const tile = document.querySelector(`.tile[data-row="${row}"][data-col="${col}"]`);
      if (!tile) return;
      tile.textContent = char || "";
    }

    function handleCharInput(char) {
      if (gameOver) return;
      if (!char) return;
      if (currentCol >= 5) return;
      currentInput.push(char);
      setTile(currentRow, currentCol, char);
      currentCol++;
    }

    function handleBackspace() {
      if (gameOver) return;
      if (currentCol === 0) return;
      currentCol--;
      currentInput.pop();
      setTile(currentRow, currentCol, "");
    }

    const dakutenMap = {
      "か": "が", "き": "ぎ", "く": "ぐ", "け": "げ", "こ": "ご",
      "さ": "ざ", "し": "じ", "す": "ず", "せ": "ぜ", "そ": "ぞ",
      "た": "だ", "ち": "ぢ", "つ": "づ", "て": "で", "と": "ど",
      "は": "ば", "ひ": "び", "ふ": "ぶ", "へ": "べ", "ほ": "ぼ",
      "う": "ゔ"
    };
    const handakutenMap = {
      "は": "ぱ", "ひ": "ぴ", "ふ": "ぷ", "へ": "ぺ", "ほ": "ぽ"
    };
    const smallMap = {
      "あ": "ぁ", "い": "ぃ", "う": "ぅ", "え": "ぇ", "お": "ぉ",
      "つ": "っ",
      "や": "ゃ", "ゆ": "ゅ", "よ": "ょ",
      "わ": "ゎ"
    };

    function applyModifier(type) {
      if (gameOver) return;
      if (currentCol === 0) return;
      const idx = currentCol - 1;
      const baseChar = currentInput[idx];
      let newChar = baseChar;
      if (type === "dakuten") {
        if (dakutenMap[baseChar]) newChar = dakutenMap[baseChar];
      } else if (type === "handakuten") {
        if (handakutenMap[baseChar]) newChar = handakutenMap[baseChar];
      } else if (type === "small") {
        if (smallMap[baseChar]) newChar = smallMap[baseChar];
      }
      currentInput[idx] = newChar;
      setTile(currentRow, idx, newChar);
    }

    function evaluateGuess() {
      if (gameOver) return;
      if (currentInput.length < 5) {
        showToast("5文字入力してください");
        shakeRow(currentRow);
        return;
      }
      const guess = currentInput.join("");
      if (!validWordsSet.has(guess)) {
        showToast("辞書に存在しない単語です");
        shakeRow(currentRow);
        return;
      }

      const targetChars = targetWord.split("");
      const guessChars = currentInput.slice();
      const result = new Array(5).fill("absent");
      const targetCount = {};

      // Count target characters
      targetChars.forEach(ch => {
        targetCount[ch] = (targetCount[ch] || 0) + 1;
      });

      // First pass: correct positions
      for (let i = 0; i < 5; i++) {
        if (guessChars[i] === targetChars[i]) {
          result[i] = "correct";
          targetCount[guessChars[i]] -= 1;
        }
      }

      // Second pass: present but wrong position
      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;
        const ch = guessChars[i];
        if (targetCount[ch] && targetCount[ch] > 0) {
          result[i] = "present";
          targetCount[ch] -= 1;
        }
      }

      // Apply tile colors
      for (let i = 0; i < 5; i++) {
        const tile = document.querySelector(`.tile[data-row="${currentRow}"][data-col="${i}"]`);
        if (!tile) continue;
        tile.classList.remove("tile-empty");
        if (result[i] === "correct") {
          tile.classList.add("tile-correct");
        } else if (result[i] === "present") {
          tile.classList.add("tile-present");
        } else {
          tile.classList.add("tile-absent");
        }
        updateKeyboardColor(guessChars[i], result[i]);
      }

      // Check win/lose
      if (guess === targetWord) {
        gameOver = true;
        showToast("正解！");
        stats.played += 1;
        stats.wins += 1;
        stats.streak = stats.lastResultWin ? stats.streak + 1 : 1;
        stats.lastResultWin = true;
        saveStats();
        updateStatsUI();
        return;
      }

      currentRow += 1;
      currentCol = 0;
      currentInput = [];

      if (currentRow >= 6) {
        gameOver = true;
        showToast(`不正解… 正解は「${targetWord}」`);
        stats.played += 1;
        stats.lastResultWin = false;
        stats.streak = 0;
        saveStats();
        updateStatsUI();
      }
    }

    function updateKeyboardColor(char, status) {
      const keys = document.querySelectorAll(`#keyboard .key-btn[data-char="${char}"]`);
      keys.forEach(key => {
        key.classList.remove("key-correct", "key-present", "key-absent");
        if (status === "correct") {
          key.classList.add("key-correct");
        } else if (status === "present") {
          key.classList.add("key-present");
        } else if (status === "absent") {
          key.classList.add("key-absent");
        }
      });
    }

    // Event bindings
    function setupKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const char = btn.getAttribute("data-char");
        if (!char) return;
        handleCharInput(char);
      });

      // Modifier row
      document.querySelectorAll("button[data-modifier]").forEach(btn => {
        btn.addEventListener("click", () => {
          const type = btn.getAttribute("data-modifier");
          applyModifier(type);
        });
      });

      document.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", () => {
          const action = btn.getAttribute("data-action");
          if (action === "backspace") {
            handleBackspace();
          } else if (action === "enter") {
            evaluateGuess();
          }
        });
      });
    }

    function setupModals() {
      const rulesBtn = document.getElementById("rules-btn");
      const rulesModal = document.getElementById("rules-modal");
      const rulesClose = document.getElementById("rules-close");
      rulesBtn.addEventListener("click", () => {
        rulesModal.classList.remove("hidden");
      });
      rulesClose.addEventListener("click", () => {
        rulesModal.classList.add("hidden");
      });
      rulesModal.addEventListener("click", (e) => {
        if (e.target === rulesModal) rulesModal.classList.add("hidden");
      });

      const statsBtn = document.getElementById("stats-btn");
      const statsModal = document.getElementById("stats-modal");
      const statsClose = document.getElementById("stats-close");
      statsBtn.addEventListener("click", () => {
        statsModal.classList.remove("hidden");
      });
      statsClose.addEventListener("click", () => {
        statsModal.classList.add("hidden");
      });
      statsModal.addEventListener("click", (e) => {
        if (e.target === statsModal) statsModal.classList.add("hidden");
      });
    }

    async function loadDictionary() {
      try {
        const res = await fetch("dictionary.json");
        const data = await res.json();
        dictionary = data;
        validWordsSet = new Set(dictionary.map(entry => entry.h));
        targetPool = dictionary.slice(); // 全単語を出題候補に
        document.getElementById("word-count-badge").textContent = `語数: ${dictionary.length}`;
        chooseTargetWord();
      } catch (e) {
        document.getElementById("word-count-badge").textContent = "辞書読み込み失敗";
        showToast("辞書の読み込みに失敗しました");
      }
    }

    window.addEventListener("load", () => {
      loadStats();
      setupKeyboard();
      setupModals();
      resetBoard();
      loadDictionary();
    });
  </script>
</body>
</html>
