<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J-wordle_TS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center p-4">

  <h1 class="text-3xl font-bold mb-2">J-wordle_TS</h1>

  <!-- カテゴリヒント -->
  <div id="category-hint" class="text-gray-300 text-lg mb-4"></div>

  <!-- 語数バッジ -->
  <div id="dict-count" class="bg-gray-700 px-3 py-1 rounded mb-4"></div>

  <!-- 入力欄 -->
  <div class="flex space-x-2 mb-4">
    <input id="input" maxlength="5"
      class="bg-gray-800 border border-gray-600 p-2 rounded w-40 text-center text-xl tracking-widest" />
    <button id="enter"
      class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">決定</button>
  </div>

  <!-- 結果表示 -->
  <div id="result" class="text-xl font-bold mb-4"></div>

  <!-- キーボード -->
  <div id="keyboard" class="grid grid-cols-10 gap-2"></div>

  <script>
    // ひらがなキーボード
    const keys = [
      "あ","い","う","え","お",
      "か","き","く","け","こ",
      "さ","し","す","せ","そ",
      "た","ち","つ","て","と",
      "な","に","ぬ","ね","の",
      "は","ひ","ふ","へ","ほ",
      "ま","み","む","め","も",
      "や","ゆ","よ",
      "ら","り","る","れ","ろ",
      "わ","を","ん",
      "ー","゛","゜","小","削"
    ];

    const keyboardEl = document.getElementById("keyboard");
    const inputEl = document.getElementById("input");
    const resultEl = document.getElementById("result");
    const dictCountEl = document.getElementById("dict-count");
    const categoryHintEl = document.getElementById("category-hint");

    // キーボード生成
    keys.forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      b.className = "bg-gray-700 hover:bg-gray-600 px-2 py-2 rounded";
      b.onclick = () => handleKey(k);
      keyboardEl.appendChild(b);
    });

    function handleKey(k) {
      if (k === "削") {
        inputEl.value = inputEl.value.slice(0, -1);
        return;
      }
      if (k === "小") {
        const last = inputEl.value.slice(-1);
        const smallMap = { "や":"ゃ","ゆ":"ゅ","よ":"ょ","つ":"っ","わ":"ゎ" };
        if (smallMap[last]) {
          inputEl.value = inputEl.value.slice(0, -1) + smallMap[last];
        }
        return;
      }
      if (k === "゛" || k === "゜") {
        const last = inputEl.value.slice(-1);
        const dakuten = {
          "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
          "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
          "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
          "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"
        };
        const handakuten = {
          "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"
        };
        if (k === "゛" && dakuten[last]) {
          inputEl.value = inputEl.value.slice(0, -1) + dakuten[last];
        }
        if (k === "゜" && handakuten[last]) {
          inputEl.value = inputEl.value.slice(0, -1) + handakuten[last];
        }
        return;
      }
      if (inputEl.value.length < 5) {
        inputEl.value += k;
      }
    }

    // ゲーム開始
    let answer = "";
    let answerCategory = "";

    async function initGame() {
      const dictionary = await fetch("dictionary.json").then(r => r.json());

      dictCountEl.textContent = `語数: ${dictionary.length}`;

      const answerObj = dictionary[Math.floor(Math.random() * dictionary.length)];
      answer = answerObj.word;
      answerCategory = answerObj.category;

      categoryHintEl.textContent = `カテゴリ: ${answerCategory}`;
    }

    initGame();

    // 判定
    document.getElementById("enter").onclick = () => {
      const guess = inputEl.value;
      if (guess.length !== 5) {
        resultEl.textContent = "5文字入力してください";
        return;
      }

      if (guess === answer) {
        resultEl.textContent = "正解！";
      } else {
        // 色判定
        let res = "";
        for (let i = 0; i < 5; i++) {
          if (guess[i] === answer[i]) res += "🟩";
          else if (answer.includes(guess[i])) res += "🟨";
          else res += "⬛";
        }
        resultEl.textContent = res;
      }
    };
  </script>

</body>
</html>
