<!-- キーボード -->
<div id="keyboard" class="grid grid-cols-10 gap-2 mt-4">
  <!-- JSで生成 -->
</div>

<script>
  // ひらがな表スタイルのキー配置
  const keyRows = [
    ["わ","ら","や","ま","は","な","た","さ","か","あ"],
    ["","り","","み","ひ","に","ち","し","き","い"],
    ["を","る","ゆ","む","ふ","ぬ","つ","す","く","う"],
    ["","れ","","め","へ","ね","て","せ","け","え"],
    ["ん","ろ","よ","も","ほ","の","と","そ","こ","お"]
  ];

  const keyboardEl = document.getElementById("keyboard");

  keyRows.forEach(row => {
    row.forEach(k => {
      const b = document.createElement("button");
      b.textContent = k || ""; // 空欄はボタンなし
      b.className = k
        ? "bg-gray-800 hover:bg-gray-700 w-10 h-10 rounded text-cyan-300 neon"
        : "w-10 h-10";
      if (k) b.onclick = () => handleKey(k);
      keyboardEl.appendChild(b);
    });
  });

  // 削除・決定ボタンを追加
  const controlRow = document.createElement("div");
  controlRow.className = "col-span-10 flex justify-center space-x-4 mt-2";
  const delBtn = document.createElement("button");
  delBtn.textContent = "削除";
  delBtn.className = "bg-pink-600 hover:bg-pink-700 px-4 py-2 rounded neon";
  delBtn.onclick = () => handleKey("削");
  const enterBtn = document.createElement("button");
  enterBtn.textContent = "決定";
  enterBtn.className = "bg-green-600 hover:bg-green-700 px-4 py-2 rounded neon";
  enterBtn.onclick = () => handleKey("決定");
  controlRow.appendChild(delBtn);
  controlRow.appendChild(enterBtn);
  keyboardEl.appendChild(controlRow);
</script>
